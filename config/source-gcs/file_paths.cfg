# Routing table for the GCS source (single recursive line).
#
#   Format: <sourceBucket>|<sinkDir>|<baseTopic>|<dynamicTopic>
#
# - <sourceBucket>  : YOUR GCS bucket NAME (bare, no gs://). The connector lists the whole
#                     bucket recursively; objects named destA/…, destB/…, destC/… route by
#                     their prefix.
# - <dynamicTopic>  : ${FILE(FNAME_P)} = the object's parent "folder" (destA/destB/destC),
#                     giving solace/fc/source/demo/<destId>, matched by the q.fc.dest-* queues.
#
# IMPORTANT: this file must be PURE ASCII (no accents, no em-dash). A non-ASCII byte makes the
# connector fail to read it (MalformedInputException) and exit.
#
# EDIT: replace REPLACE-WITH-YOUR-SOURCE-BUCKET with your bucket name.
REPLACE-WITH-YOUR-SOURCE-BUCKET|/outbound|solace/fc/source/demo|solace/fc/source/demo/${FILE(FNAME_P)}
